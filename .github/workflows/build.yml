name: build

# Plan C.  A hosted runner cannot build this module from scratch: the payload compiles against
# the platform framework including hidden APIs, and the two native binaries link static bionic
# and static BoringSSL.  So a machine with an AOSP tree publishes tools/make-aosp-deps.sh output
# as a release asset, and this workflow compiles daemon/src itself and only assembles the module.
# See docs/en/building.md ("CI" / "Building on a hosted runner").
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      aosp_deps_tag:
        description: Release tag holding okcarlink-aosp-deps.tar.gz
        required: false
        default: aosp-deps

permissions:
  contents: write

env:
  AOSP_DEPS_TAG: ${{ github.event.inputs.aosp_deps_tag || 'aosp-deps' }}
  BUILD_TOOLS: '34.0.0'

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags: the release notes need the commit range back to the
          # previous tag (shallow clones cannot answer git describe/log across tags).
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate d8 (the runner ships an Android SDK; install build-tools only if it is missing)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          find_d8() { ls "$SDK"/build-tools/*/d8 2>/dev/null | sort -V | tail -1; }
          D8="$(find_d8 || true)"
          if [ -z "$D8" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SM" ] || { echo "no d8 and no sdkmanager under $SDK"; exit 1; }
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" --install "build-tools;$BUILD_TOOLS" >/dev/null 2>&1 || true
            D8="$(find_d8 || true)"
          fi
          [ -n "$D8" ] || { echo "no d8 available: install build-tools, or add d8.jar to the dependency bundle"; exit 1; }
          echo "D8=$D8" >> "$GITHUB_ENV"
          echo "using $D8"

      - name: Fetch the AOSP dependency bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$AOSP_DEPS_TAG" -R "$GITHUB_REPOSITORY" \
            -p okcarlink-aosp-deps.tar.gz -O /tmp/deps.tar.gz --clobber
          mkdir -p /tmp/deps
          tar -xzf /tmp/deps.tar.gz -C /tmp/deps
          ( cd /tmp/deps && grep -E '^[0-9a-f]{64}  ' deps-manifest.txt | sha256sum -c - )

      - name: Compile daemon/src and assemble the module
        run: |
          set -euo pipefail
          mkdir -p build
          cp /tmp/deps/prebuilt/okcar-uinputd /tmp/deps/prebuilt/okcar-ffs-usbmux build/
          export FRAMEWORK_JARS="${FRAMEWORK_JARS:-/tmp/deps/framework-jars}"
          # android.jar comes from the bundle (a fixed file), so only d8 has to come from the runner.
          export ANDROID_JAR="$FRAMEWORK_JARS/android.jar"
          export REQUIRE_ARTIFACTS=1
          bash tools/package-module.sh

      - name: Verify the package
        run: |
          set -euo pipefail
          zip=$(ls build/okcarlink-*.zip)
          unzip -l "$zip"
          for f in module.prop post-fs-data.sh service.sh \
                   system/bin/okcar-uinputd system/bin/okcar-ffs-usbmux \
                   payload/okcar-link.dex webroot/variant webroot/app.js; do
            unzip -l "$zip" | grep -q " $f$" || { echo "missing from the zip: $f"; exit 1; }
          done
          # The zip must carry the version the tag names (v1.0.1 -> version=1.0.1);
          # on non-tag builds just require a version line to exist.
          _zipver=$(unzip -p "$zip" module.prop | sed -n 's/^version=//p' | head -1)
          case "${GITHUB_REF_NAME:-}" in
            v*) [ "$_zipver" = "${GITHUB_REF_NAME#v}" ] || { echo "module.prop version '$_zipver' does not match the tag $GITHUB_REF_NAME"; exit 1; } ;;
            *) [ -n "$_zipver" ] || { echo "module.prop has no version line"; exit 1; } ;;
          esac
          unzip -p "$zip" payload/okcar-link.dex > /tmp/okcar-link.dex
          [ "$(head -c 3 /tmp/okcar-link.dex)" = "dex" ] || { echo "payload is not a dex"; exit 1; }
          grep -aq 'com/okcar/link/daemon/LinkDaemon' /tmp/okcar-link.dex \
            || { echo "the dex does not contain LinkDaemon: wrong classpath or sources"; exit 1; }
          sha256sum /tmp/okcar-link.dex build/okcar-uinputd build/okcar-ffs-usbmux
          # basename only, so the downloaded asset verifies with a plain `sha256sum -c`
          ( cd "$(dirname "$zip")" && sha256sum "$(basename "$zip")" ) > "$zip.sha256"
          cat "$zip.sha256"

      - name: Upload the module zip
        uses: actions/upload-artifact@v5
        with:
          name: okcarlink-module
          path: |
            build/okcarlink-*.zip
            build/okcarlink-*.zip.sha256
          if-no-files-found: error

      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          zip=$(ls build/okcarlink-*.zip)
          # Release notes: the commit subjects since the previous tag, with the annotated
          # tag's subject as a fallback and a plain line as the last resort. Generating
          # notes must never fail the build, so every probe here is guarded.
          notes=""
          if prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null); then
            notes=$(git log --no-merges -30 --format='- %s' "$prev..$GITHUB_REF_NAME")
          fi
          if [ -z "$notes" ]; then
            notes=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          fi
          [ -n "$notes" ] || notes="KernelSU/Magisk module built by .github/workflows/build.yml. Assets include the SHA-256 file."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --title "OkCarLink $GITHUB_REF_NAME" --notes "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" "$zip" "$zip.sha256" --clobber
